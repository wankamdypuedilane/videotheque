# pas de banniere Spring au demarrage
spring.main.banner-mode=off

# base de donnees h2 en memoire
spring.datasource.url=jdbc:h2:mem:videotheque;MODE=MySQL;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE;
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.platform=h2
spring.h2.console.enabled=true

# hibernate : le schema vient de schema.sql
spring.jpa.hibernate.ddl-auto=none

# trace des requetes SQL dans la console
spring.jpa.show-sql=true

# messages d'erreur renvoyes au client
server.error.include-message=always

# log
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG